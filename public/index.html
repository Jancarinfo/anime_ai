<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"><title>Anime AI</title></head><body><main><h1>حوّل صورتك إلى أنمي</h1><p class="lead">صورة واحدة. لمسة واحدة.</p><label class="pick">📷 التقاط صورة<input id="camera" type="file" accept="image/*" capture="environment"></label><label class="pick">🖼️ اختيار من الاستوديو<input id="gallery" type="file" accept="image/*"></label><section id="preview"><span>صورتك ستظهر هنا</span></section><button id="go" disabled>تحويل إلى أنمي</button><p id="status"></p><p class="note">استخدم صوراً مناسبة فقط. تُرفض الصور العارية أو الجنسية. تُعالج الصورة لتقديم الخدمة ولا تُستخدم للتحسين دون موافقة منفصلة.</p></main><script src="/app.js"></script></body></html>
